    <title>Talovin — Social Lounge</title>
    <meta name="description" content="Talovin — Sảnh không gian kết nối thời gian thực & chia sẻ đa phương tiện." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Đảm bảo không bị cache Service Worker cũ làm trắng trang
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        }).catch(function() {});
      }
    </script>
  </body>
</html>
