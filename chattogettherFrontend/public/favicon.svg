<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>

  <!-- Synchronous Wave / S Icon -->
  <g filter="url(#glow)">
    <!-- Top arc wave -->
    <path d="M42 22C42 16.5 37.5 13 32 13C25 13 20 18 20 25C20 33 44 31 44 39C44 46 39 51 32 51C26.5 51 22 47.5 22 42" 
          stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Harmonious Audio Pulse Nodes -->
    <circle cx="21" cy="25" r="3.2" fill="#38bdf8"/>
    <circle cx="43" cy="39" r="3.2" fill="#a78bfa"/>
    <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
  </g>
</svg>