spring.application.name=demo
server.port=${PORT:8080}

# 1. URL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-noisy-art-ao5oc2sf.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}

# 2. Username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}

# 3. Password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_rbka46vhfzjM}

# HikariCP settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 6. Dialect configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Java 21 Virtual Threads & Async Optimization
spring.threads.virtual.enabled=true

# Server timeout settings
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-http-form-post-size=35MB
server.tomcat.max-swallow-size=35MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=35MB

