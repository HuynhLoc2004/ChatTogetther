# ===================================================================
# TALOVIN PRODUCTION PROFILE CONFIGURATION
# ===================================================================
spring.application.name=talovin-backend
server.port=${PORT:8080}

# Proxy & Security Behind Nginx Reverse Proxy
server.forward-headers-strategy=framework

# Compression Optimization (Tiết kiệm băng thông, tăng tốc API & WebSocket)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Production Error Handling (Bảo mật: ẩn stacktrace và internal error messages)
server.error.include-stacktrace=never
server.error.include-message=never

# Database PostgreSQL Connection (Neon or Docker Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/talovin_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talovin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:talovin_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Tối ưu cho 4GB RAM / 1 vCPU)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate Production Settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Caching & Messaging
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# JWT & Authentication
jwt.secret_key=${JWT_SECRET:${JWT_SECRET_KEY:huynhtanloc27102004deptraiquadithoiabcdefghjk}}
jwt.exp_access=${JWT_EXP_ACCESS:60}
jwt.exp_refresh=${JWT_EXP_REFRESH:10080}

# Allowed Origins for CORS
allowed.origins=${ALLOWED_ORIGINS:https://talovin.duckdns.org,https://chat-togetther.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000}

# Cloudflare R2 Object Storage (0$ Egress Bandwidth, S3 Compatible)
r2.account_id=${R2_ACCOUNT_ID:58adca9a5a385fdb2618f638bfda563}
r2.access_key_id=${R2_ACCESS_KEY_ID:4c92a085f610b93b0b89701c91978faa}
r2.secret_access_key=${R2_SECRET_ACCESS_KEY:0079051cc76a1e244a101d77f532b4be843405f88d5e0631c429224796f80715}
r2.bucket_name=${R2_BUCKET_NAME:museum}
r2.public_url=${R2_PUBLIC_URL:https://pub-bb1eeff16fd349f2abb33e4e71fe1ae7.r2.dev}

# Server Tomcat Limits & Upload Settings
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-http-form-post-size=35MB
server.tomcat.max-swallow-size=35MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=35MB
