# ===================================================================
# NGINX PRODUCTION CONFIGURATION — TALOVIN
# ===================================================================

# Ẩn thông tin phiên bản Nginx & Rate Limiting chống spam API
server_tokens off;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;

# Upstream trỏ về Spring Boot backend container
upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# -------------------------------------------------------------------
# Server Block 1: HTTP (Port 80) -> Certbot Challenge & HTTPS Redirect
# -------------------------------------------------------------------
server {
    listen 80;
    server_name talovin.duckdns.org;

    # Auto-renew SSL Let's Encrypt qua Certbot mà không cần tắt Nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint Nginx không cần chuyển hướng HTTPS
    location /nginx-health {
        access_log off;
        return 200 "nginx is healthy\n";
    }

    # Redirect toàn bộ request còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------
# Server Block 2: HTTPS (Port 443) -> SSL TLSv1.2/1.3 + Reverse Proxy
# -------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name talovin.duckdns.org;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/talovin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talovin.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers chuẩn Production
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Giới hạn kích thước upload 25MB (ảnh, voice, avatar)
    client_max_body_size 25M;

    # WebSocket Proxy (STOMP / SockJS / WebRTC signaling: /ws, /ws-gs-guide, /ws-sockjs, /ws-native)
    location ~* ^/(ws|ws-gs-guide|ws-sockjs|ws-native) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Trang chào mừng / Kiểm tra trạng thái khi người dùng mở domain trên trình duyệt
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Talovin Production API</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#f8fafc;text-align:center;padding:1rem}.card{background:#1e293b;padding:2.5rem;border-radius:1rem;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-width:480px;border:1px solid #334155}.badge{display:inline-block;background:#10b981;color:#fff;padding:0.35rem 0.85rem;border-radius:9999px;font-size:0.875rem;font-weight:600;margin-bottom:1.25rem}h1{margin:0 0 0.75rem;font-size:1.75rem;letter-spacing:-0.025em}p{color:#94a3b8;font-size:0.95rem;line-height:1.6;margin:0 0 1.5rem}.btn{display:inline-block;padding:0.75rem 1.5rem;background:#6366f1;color:#fff;text-decoration:none;border-radius:0.5rem;font-weight:600;box-shadow:0 4px 12px rgba(99,102,241,0.3);transition:background 0.2s}.btn:hover{background:#4f46e5}.info{margin-top:1.5rem;font-size:0.8rem;color:#64748b}</style></head><body><div class="card"><div class="badge">&#9679; H&#7878; TH&#7888;NG &#272;ANG HO&#7840;T &#272;&#7896;NG</div><h1>Talovin Backend API</h1><p>M&aacute;y ch&#7911; Backend Spring Boot, WebSocket v&agrave; Cloudflare R2 storage tr&ecirc;n VPS &#273;&atilde; ho&#7841;t &#273;&#7895;ng s&#7861;n s&agrave;ng!</p><a href="https://chat-togetther.vercel.app" class="btn">M&#7903; giao di&#7879;n Talovin (Frontend)</a><div class="info">API Endpoint: talovin.duckdns.org/api &bull; Status: UP</div></div></body></html>';
    }

    # REST API & General Traffic kèm Rate Limiting chống DDoS
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
