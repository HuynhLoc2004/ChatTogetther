# ===================================================================
# NGINX PRODUCTION CONFIGURATION — TALOVIN
# ===================================================================

# Ẩn thông tin phiên bản Nginx & Rate Limiting chống spam API
server_tokens off;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;

# Upstream trỏ về Spring Boot backend container
upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# -------------------------------------------------------------------
# Server Block 1: HTTP (Port 80) -> Certbot Challenge & HTTPS Redirect
# -------------------------------------------------------------------
server {
    listen 80;
    server_name talovin.duckdns.org;

    # Auto-renew SSL Let's Encrypt qua Certbot mà không cần tắt Nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint Nginx không cần chuyển hướng HTTPS
    location /nginx-health {
        access_log off;
        return 200 "nginx is healthy\n";
    }

    # Redirect toàn bộ request còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------
# Server Block 2: HTTPS (Port 443) -> SSL TLSv1.2/1.3 + Reverse Proxy
# -------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name talovin.duckdns.org;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/talovin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talovin.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers chuẩn Production
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Giới hạn kích thước upload 25MB (ảnh, voice, avatar)
    client_max_body_size 25M;

    # Frontend Static Files (SPA Root)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip nén file tĩnh để tải web siêu tốc
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # WebSocket Proxy (STOMP / SockJS / WebRTC signaling: /ws, /ws-gs-guide, /ws-sockjs, /ws-native)
    location ~* ^/(ws|ws-gs-guide|ws-sockjs|ws-native) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA Frontend Pages (React Router: /friends, /messages, /communities, /call, /profile, /login, /register)
    # Luôn phục vụ index.html, tuyệt đối không proxy sang Spring Boot tránh lỗi 401 trên trình duyệt
    location ~* ^/(communities|friends|messages|call|profile|login|register) {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # REST API & Backend Endpoints (Toàn bộ API backend bắt đầu bằng /api/)
    # Dùng ^~ để Nginx KHÔNG bị các regex đuôi file (.jpg, .png, .mp4, ...) ở dưới đè, đảm bảo tệp media tải lên luôn qua backend
    location ^~ /api/ {
        # Tự động chuẩn hóa nếu client cũ còn lưu cache gửi /api/api/...
        rewrite ^/api/api/(.*)$ /api/$1 break;

        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 308 /api/;
    }

    # Static assets cache dài hạn (JS, CSS, images, fonts của frontend Vite)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|webp|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single Page Application (SPA): Mọi route URL của React Router đều fallback về index.html
    # Không cache index.html để khi deploy phiên bản mới, client luôn nhận file index mới nhất
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
