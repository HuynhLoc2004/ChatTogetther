name: Deploy Talovin Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Spring Boot JAR
        run: |
          cd chattogettherBackend/Backend
          mvn clean package -DskipTests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chattogettherFrontend/package-lock.json

      - name: Build React Frontend SPA
        run: |
          cd chattogettherFrontend
          npm ci
          npm run build

      - name: Create .env File from GitHub Secret
        run: |
          printf "%s\n" "${{ secrets.ENV_FILE }}" > .env

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy_stage/chattogettherBackend/Backend/target
          mkdir -p deploy_stage/target
          mkdir -p deploy_stage/nginx
          mkdir -p deploy_stage/frontend_dist
          cp chattogettherBackend/Backend/target/*.jar deploy_stage/chattogettherBackend/Backend/target/
          cp chattogettherBackend/Backend/Dockerfile deploy_stage/chattogettherBackend/Backend/
          cp chattogettherBackend/Backend/target/*.jar deploy_stage/target/
          cp chattogettherBackend/Backend/Dockerfile deploy_stage/Dockerfile
          cp -r chattogettherFrontend/dist/* deploy_stage/frontend_dist/
          cp docker-compose.yml deploy_stage/
          cp nginx/default.conf deploy_stage/nginx/
          cp .env deploy_stage/

      - name: Copy Deployment Artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy_stage/*,deploy_stage/**"
          target: "/opt/talovin"
          strip_components: 1

      - name: Execute Docker Compose Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            echo ">>> [0/5] Ensuring Docker and Docker Compose are installed..."
            if ! command -v docker >/dev/null 2>&1; then
              echo ">>> Docker not found, installing Docker & Docker Compose..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update && apt-get install -y docker-compose-plugin || true
            fi

            echo ">>> [1/5] Configuring firewall rules (80, 443, 22)..."
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 22/tcp || true
            fi

            echo ">>> [2/5] Checking SSL Certificate status..."
            mkdir -p /etc/letsencrypt/live/talovin.duckdns.org
            mkdir -p /var/www/certbot
            
            NEED_CERT=0
            if [ ! -f /etc/letsencrypt/live/talovin.duckdns.org/fullchain.pem ] || [ ! -f /etc/letsencrypt/live/talovin.duckdns.org/privkey.pem ]; then
              echo ">>> Initializing bootstrap self-signed SSL certificate so Nginx can start safely..."
              docker run --rm -v /etc/letsencrypt:/etc/letsencrypt alpine/openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/letsencrypt/live/talovin.duckdns.org/privkey.pem \
                -out /etc/letsencrypt/live/talovin.duckdns.org/fullchain.pem \
                -subj "/CN=talovin.duckdns.org"
              NEED_CERT=1
            fi

            echo ">>> [3/5] Starting Docker Compose stack..."
            chmod 600 /opt/talovin/.env
            cd /opt/talovin
            docker compose up -d --build

            if [ "$NEED_CERT" = "1" ]; then
              echo ">>> [4/5] Requesting genuine Let's Encrypt SSL certificate via Certbot..."
              sleep 5
              docker run --rm \
                -v /etc/letsencrypt:/etc/letsencrypt \
                -v /var/www/certbot:/var/www/certbot \
                certbot/certbot certonly --webroot -w /var/www/certbot \
                -d talovin.duckdns.org \
                --email huynhloc2004@gmail.com \
                --agree-tos --no-eff-email \
                --force-renewal || echo ">>> Certbot warning: check DNS propagation or firewall if cert generation fails"
              
              docker compose exec -T nginx nginx -s reload || docker compose restart nginx || true
            else
              echo ">>> [4/5] SSL Certificate already present, running certbot renewal check..."
              docker run --rm \
                -v /etc/letsencrypt:/etc/letsencrypt \
                -v /var/www/certbot:/var/www/certbot \
                certbot/certbot renew --webroot -w /var/www/certbot --quiet || true
              docker compose restart nginx || docker compose exec -T nginx nginx -s reload || true
            fi

            echo ">>> [5/5] Setting up auto-renew cron and verifying status..."
            (crontab -l 2>/dev/null | grep -q "certbot renew") || (crontab -l 2>/dev/null; echo "0 3 * * * docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/www/certbot:/var/www/certbot certbot/certbot renew --webroot -w /var/www/certbot --quiet && docker exec talovin-nginx nginx -s reload") | crontab - || true

            docker image prune -f
            sleep 5
            echo "=== Docker Compose Status ==="
            docker compose ps
            echo "=== Backend Logs ==="
            docker compose logs --tail=50 backend
            echo "=== Nginx Logs ==="
            docker compose logs --tail=25 nginx
