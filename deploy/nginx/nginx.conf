# ==============================================================================
# KLYVIX HIGH-SECURITY & ANTI-DDOS NGINX CONFIGURATION
# Kiến trúc bảo mật đa tầng: Ẩn thông tin mạng, Chống DDoS, Rate Limit, HTTPS Hardening
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 1. ẨN DANH & BẢO VỆ TẦNG MẠNG (Network Data Masking & Information Obfuscation)
    # --------------------------------------------------------------------------
    # Che giấu phiên bản Nginx để hacker không dò được lỗ hổng CVE
    server_tokens off;

    # Format log tiêu chuẩn ghi lại Client IP thật (hỗ trợ đằng sau Cloudflare / Load Balancer)
    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'cs=$upstream_cache_status client_ip=$http_x_forwarded_for';

    access_log /var/log/nginx/access.log security_log buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Tối ưu truyền tải file
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # 2. CHỐNG SLOWLORIS & BUFFER OVERFLOW (DDoS & Memory Exhaustion Defense)
    # --------------------------------------------------------------------------
    # Giới hạn kích thước payload (chặn kẻ tấn công gửi file 1GB làm tràn RAM server)
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Timeout đóng kết nối treo (Slowloris attack)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # --------------------------------------------------------------------------
    # 3. RATE LIMITING TẦNG PROXY (Chặn spam trước khi tới Spring Boot Tomcat)
    # --------------------------------------------------------------------------
    # Tạo các vùng nhớ đệm lưu IP (10MB lưu được ~160.000 IP)
    limit_req_zone $binary_remote_addr zone=general_api_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict_zone:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=posts_create_zone:10m rate=15r/m;

    # Giới hạn số lượng kết nối đồng thời từ 1 IP (chống mở 100 tab spam)
    limit_conn_zone $binary_remote_addr zone=conn_ip_zone:10m;

    # Trả về HTTP 429 thay vì 503 khi bị giới hạn
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # 4. GZIP NÉN DỮ LIỆU TỐC ĐỘ CAO
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream kết nối vào Spring Boot Backend
    upstream backend_cluster {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # CẤU HÌNH SERVER CHÍNH (SSL / TLS & HTTP REVERSE PROXY)
    # ==========================================================================
    server {
        listen 80;
        server_name klyvix.space www.klyvix.space;

        # Chuyển hướng toàn bộ sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name klyvix.space www.klyvix.space;

        # Đường dẫn chứng chỉ SSL (Let's Encrypt / Cloudflare Origin Cert)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Chuẩn bảo mật TLS 1.2 và 1.3 cao nhất (loại bỏ TLS 1.0, 1.1 lỗi thời)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # 5. CÁC TIÊU CHUẨN BẢO MẬT HTTP HEADERS (Security Response Headers)
        # ----------------------------------------------------------------------
        # Chống Clickjacking
        add_header X-Frame-Options "DENY" always;
        # Chống MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Bật XSS Filter
        add_header X-XSS-Protection "1; mode=block" always;
        # Bảo vệ thông tin Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Ép buộc trình duyệt chỉ dùng HTTPS trong 1 năm (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Che giấu nguồn gốc backend từ phản hồi proxy
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        add_header Server "Klyvix-Edge-Shield" always;

        # Giới hạn 15 kết nối đồng thời từ 1 IP
        limit_conn conn_ip_zone 15;

        # Xử lý trang lỗi 429 dạng JSON chuyên nghiệp
        error_page 429 = @rate_limit_json;
        location @rate_limit_json {
            default_type application/json;
            return 429 '{"code":429,"statusCode":429,"message":"Tần suất truy cập từ IP của bạn quá cao. Vui lòng thử lại sau 1 phút!"}';
        }

        # ----------------------------------------------------------------------
        # 6. ROUTE: BẢO VỆ API ĐĂNG NHẬP & ĐĂNG KÝ (Brute-force Protection)
        # ----------------------------------------------------------------------
        location ~* ^/api/(auth/login|users/create) {
            limit_req zone=auth_strict_zone burst=3 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # ----------------------------------------------------------------------
        # 7. ROUTE: BẢO VỆ API TẠO BÀI VIẾT & BÌNH LUẬN (Content Spam Protection)
        # ----------------------------------------------------------------------
        location ~* ^/api/posts {
            limit_req zone=posts_create_zone burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
        }

        # ----------------------------------------------------------------------
        # 8. ROUTE: TẤT CẢ CÁC API THÔNG THƯỜNG
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=general_api_zone burst=15 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # 9. ROUTE: WEBSOCKET REALTIME (Đàm thoại & Chat phòng)
        # ----------------------------------------------------------------------
        location /ws-gs-guide/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Nâng cấp kết nối HTTP lên WebSocket chuẩn
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Giữ kết nối WebSocket liên tục trong 1 giờ
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------------------
        # 10. FRONTEND STATIC ASSETS CACHING (React SPA)
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache tài nguyên tĩnh (js, css, ảnh) trong 7 ngày
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
                expires 7d;
                add_header Cache-Control "public, no-transform";
                access_log off;
            }
        }
    }
}

